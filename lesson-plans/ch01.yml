# 第 1 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 1
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出大数据的 5V 特征，区分结构化、半结构化和非结构化数据，并各举一个电商平台中的例子
  - 画出大数据处理的五个步骤，并为每一步说出本书用到的组件
  skill:
  - 估算一批数据的大小和一台电脑处理它所需的时间，说明横向扩展、分而治之和移动计算为什么能解决“一台电脑不够用”的问题
  - 判断一个数据处理任务应该用 pandas 这样的单机工具，还是用 Hadoop、Spark 这样的集群工具
  - 运行第一个 PySpark 程序，统计小象优选各省份的订单量和销售额
  quality:
  - 养成“动手前先算一算”的习惯，用数量级判断技术方案，不盲目追求“上集群”
  - 了解国家数据资源的发展和大数据相关新职业，认识数据安全与个人信息保护的重要性
key_points:
- 大数据的 5V 特征和三类数据
- 数据量估算：单位换算、一台电脑读 1 TB 要多久
- 横向扩展、分而治之、移动计算
- 大数据处理的五个步骤和本书的组件地图
difficulties:
- point: 学生对 GB、TB、PB 没有直观感受，说不清“大”到底意味着什么
  solution: 从小象优选一行日志 75 字节算起，一步步推出一天 70 MB、一年 25 GB、1 TB 读一遍近 2 小时；再用“单机与集群耗时估算器”拖动数据量，让学生看到耗时的数量级变化
- point: 误以为“集群总是比单机快”，什么数据都想上集群
  solution: 用估算器的“70 MB 一天的日志”场景展示集群反而慢 20 秒，结合实验 1-1 测得的内存占用和第 4 章的实测数据，归纳出“几 GB 以内用 pandas”的经验
- point: 组件名称多，学生记不住各自做什么
  solution: 不要求逐个记忆，按“采集、存储、计算、分析、可视化”五步把组件放进流程图；让学生在实验 1-3 中为自己熟悉的业务画一张流程图
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 120
    content: 学习网页教材第 1 章 1.1～1.6 节，完成 1.1.3 和 1.2.1 节的“算一算”，操作“单机与集群耗时估算器”动画
    teacher: 在学习平台发布学习任务单和三个预习问题：小象优选一年的日志有多大？1 TB 一台电脑读一遍要多久？什么时候才值得用集群？
    student: 阅读教材、完成两个“算一算”、操作动画，在讨论区提交预习问题的回答
    intent: 概念和数据量估算线上自学，面授时集中解决“怎样判断”的问题
  - name: 实验 1-1
    minutes: 30
    content: 实验 1-1 安装 Python 实验环境，生成 1 万到 100 万行订单，记录文件大小、读取时间和内存
    teacher: 提供实验指导和常见问题排查表，在线答疑（重点是 Python 3.12 和国内 pip 镜像）
    student: 完成实验 1-1，填写实验记录表
    intent: 让学生亲手测出“内存是文件的 5.6 倍”，为面授讨论提供数据
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 小周入职第一天：Excel 能打开一天的日志吗？一年的呢？大促那天呢？
    teacher: 讲述情景，请学生用预习时的“算一算”回答
    student: 报告估算结果
    intent: 从身边的数据规模引出大数据问题
  - name: 难点讲解：数据量与单机的极限
    minutes: 12
    content: 讲评预习问题；汇总学生实验 1-1 的结果，推算各自电脑能处理多少行订单；讲解纵向扩展与横向扩展、分而治之、移动计算
    teacher: 投屏汇总实验数据，用快递站、阅卷的比方讲解三个思想
    student: 报告自己电脑的测量结果，回答“1 亿行订单你的电脑能不能处理”
    intent: 突破难点一，用学生自己的数据说明单机的极限
  - name: 动画演示：什么时候值得用集群
    minutes: 8
    content: 用“单机与集群耗时估算器”演示 70 MB、1 TB、1 PB 三个场景，再把机器数拖到 1000 台、把速度改成 Python 逐行处理，观察交叉点的变化
    teacher: 操作动画，追问“为什么机器再多时间也不再减少”
    student: 观察并回答，总结选择工具的经验
    intent: 突破难点二，建立“按数据量选工具”的判断
  - name: 组件地图
    minutes: 10
    content: 用五步流程图串起 HDFS、YARN、MapReduce、Hive、Spark、Kafka、Superset；介绍大数据与人工智能的关系、MaxCompute 和 MRS、三类岗位；讨论 Text-to-SQL
    teacher: 板书流程图，请学生把组件卡片贴到对应位置
    student: 分组完成组件归位，说出每个组件一句话的作用
    intent: 突破难点三，形成全书的知识框架
  - name: 课堂练习
    minutes: 7
    content: 课后练习中的单选第 2、5、9 题，多选第 1 题，判断第 2 题（在线作答）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 3
    content: 用本章知识导图回顾要点，布置实验 1-2，预告第 2 章用 Docker 搭集群
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 实验 1-2（实验 1-3 选做）
    minutes: 30
    content: 安装 Java 和 PySpark，运行第一个 Spark 程序统计各省订单；学有余力的完成实验 1-3 数据流程图；完成本章课后练习（在线作答 18 题，简答 / 实操 5 题）
    teacher: 在线答疑，重点解决 Java 安装和 JAVA_HOME 问题
    student: 完成实验，提交实验报告
    intent: 第一次体验 Spark，为第 6 章做铺垫
homework:
- 简答题：用 5V 特征分析一家外卖平台的数据，每个特征各举一个例子。
- 简答题：小王说：“集群那么快，公司以后所有数据处理都放到 Hadoop 集群上做。”你同意吗？请结合数据量说明理由。
- 简答题：画出（或用文字写出）大数据处理的五个步骤，并为每一步写出一个本书用到的组件。
- 实操题：修改实验 1-2 的程序，统计各品类商品的销售额。
- 实操题：用 1.2.4 节的估算器回答：5 TB 日志要在 5 分钟内处理完，至少需要多少台机器？
- 实验报告：实验 1-1、实验 1-2、实验 1-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
