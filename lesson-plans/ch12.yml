# 第 12 章教案底稿。字段说明见 lesson-plans/README.md
chapter: 12
online: 4
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 小组合作学习
- 线上自主学习
- 项目教学法
objectives:
  knowledge:
  - 说出比较、趋势、构成、分布、关系、地区、转化各用什么图，以及常见的误导性图表
  - 说出 Superset 中数据库、数据集、图表、看板四个概念
  - 说出个人信息保护法、数据安全法的要点，区分个人信息、敏感个人信息、去标识化和匿名化
  skill:
  - 用 pyecharts 画柱状图、折线图、地图、环形图、漏斗图并组成网页报告
  - 用 Superset 连接 MySQL、注册数据集、制作图表、拼成看板
  - 编写手机号、身份证号等字段的脱敏代码，按最小权限原则设置只读账号和目录权限
  - 以小组为单位完成从原始数据到看板的综合项目，撰写项目报告
  quality:
  - 树立依法合规使用数据、保护个人信息的意识
  - 用诚实、清楚的图表表达结论，不用图表误导他人
  - 在小组项目中分工协作，提高沟通表达能力
key_points:
- 按要说明的问题选择图表
- pyecharts 报告与 Superset 看板
- 两部法律的要点，脱敏和最小权限
- 综合项目的流程、报告和评分
difficulties:
- point: 学生容易被“好看”的图表吸引，识别不出误导性图表
  solution: 用“图表选择助手”动画的“找误导”，先只展示纵轴从 430 开始的柱状图，让学生估计“28 日是 25 日的几倍”，再切换到从 0 开始；对比折线图为什么可以不从 0 开始
- point: 去标识化和匿名化的区别，加盐哈希为什么仍是个人信息
  solution: 引用个人信息保护法第七十三条原文；用实验 12-3 的脱敏结果讨论“谁能把哈希值对应回这个人”；讨论“身份证号格式固定，不加盐可以穷举反查”
- point: Superset 界面以英文为主、涉及多个容器，学生容易卡在连接数据库
  solution: 课上完整演示一遍连接数据库到拼看板；强调主机名写 mysql、带 charset=utf8mb4、用只读账号
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 80
    content: 学习网页教材第 12 章 12.1～12.6 节，操作“图表选择助手”动画
    teacher: 在学习平台发布学习任务单和三个预习问题：柱状图的纵轴为什么要从 0 开始？什么是敏感个人信息？去标识化和匿名化有什么区别？
    student: 阅读教材、操作动画，在讨论区提交预习问题的回答和疑问
    intent: 概念线上自学，把面授时间留给演示、讨论和项目
  - name: 实验 12-1
    minutes: 30
    content: Spark 算出 5 张小表，pyecharts 画成网页报告
    teacher: 提供实验指导和常见问题排查表，在线答疑
    student: 完成实验 12-1，写出从报告中读出的 3 条结论
    intent: 先做出报告，带着结论进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 4
    content: 周一的经营会：31 行的表格和 31 个扇形的饼图，以及法务部的提醒
    teacher: 展示两版汇报材料，请学生挑毛病
    student: 讨论回答
    intent: 引出可视化和合规两条主线
  - name: 难点讲解：选图与误导性图表
    minutes: 12
    content: 选图口诀和好图表的共同点；用动画演示四种误导性图表；学生展示课前报告的结论
    teacher: 操作动画，组织学生互评报告
    student: 展示并互评
    intent: 突破难点一
  - name: Superset 看板演示
    minutes: 14
    content: 演示建只读账号、连接数据库、注册数据集、做图表、拼看板
    teacher: 投屏完整演示
    student: 跟做或记录关键步骤
    intent: 突破难点三
  - name: 难点讲解：数据合规
    minutes: 16
    content: 两部法律的要点和四个概念；数据分类分级；脱敏的写法和检查；最小权限；案例讨论“同事把原始数据导出到个人电脑”
    teacher: 讲授并组织案例讨论
    student: 小组讨论并提出整改建议
    intent: 突破难点二，树立合规意识
  - name: 综合项目布置
    minutes: 22
    content: 演示一键流水线；讲项目报告模板和评分标准；小组确定业务问题和分工
    teacher: 布置任务，巡视指导各组选题
    student: 分组讨论，填写项目计划
    intent: 启动综合项目
  - name: 课堂练习
    minutes: 14
    content: 课后练习中的单选第 2、3、5、7、8 题，多选第 1、4 题，判断第 5 题（在线作答）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 8
    content: 用知识导图回顾本章；全书结束语：分而治之、先算小、先测量、守规矩
    teacher: 带领学生回顾全书
    student: 说出自己印象最深的一个思路
    intent: 形成全书知识结构
- phase: 课后（线上）
  steps:
  - name: 实验 12-2、12-3
    minutes: 70
    content: 完成实验 12-2（Superset 销售看板）；以小组为单位完成实验 12-3 综合项目，提交项目报告并准备答辩；完成本章课后练习
    teacher: 在线答疑，检查各组进度
    student: 完成看板和综合项目，提交报告
    intent: 综合运用全书知识
homework:
- 简答题：写出“比较、趋势、构成、分布、关系、转化”六种目的各自推荐的图表，并各举一个小象优选的例子。
- 简答题：法务部发现，公司有几位同事把含有会员手机号、身份证号的原始数据导出到了自己的电脑上做分析。请你从数据合规的角度提出整改建议。
- 简答题：实验 12-3 中，为什么要给身份证号“加盐”再做 SHA-256，而不是直接做 SHA-256？加盐哈希后的数据还算个人信息吗？
- 实操题：用 pyecharts 画一个散点图，横轴是 9 月每天的订单数，纵轴是每天的销售额（万元），数据用实验 12-1 生成的 `data/report/daily/`。再用 Spark 或 pandas 计算两者的相关系数，说说图上看到的关系和相关系数是否一致。
- 实操题：身份证号的第 7～14 位是出生日期，精确的出生日期也是个人信息。请对 `data/xiaoxiang/members.csv` 做**泛化**：用身份证号中的出生年份算出年龄（按 2026 年粗略计算），换成“30～39 岁”这样的年龄段，统计各年龄段的人数。
- 实验报告：实验 12-1、实验 12-2；综合项目报告（实验 12-3，小组完成）
assessment: 课堂练习正确率、课后作业、实验报告和综合项目答辩计入平时成绩
reflection: ''
