# 第 2 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 2
online: 4
offline: 2
methods:
- 讲授法
- 演示法
- 任务驱动法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出镜像、Docker 容器、端口映射、数据卷四个概念的含义，以及随书集群中每个容器运行哪些 Hadoop 进程
  skill:
  - 使用常用的 Linux 命令和 Docker 命令，拉取镜像、运行和管理容器
  - 启动随书 Hadoop 集群，用 jps、9870 和 8088 网页检查它是否正常，并填写节点检查表
  - 修改 Hadoop 最常改的配置项（副本数、内存），让修改生效，并给集群增加一个工作节点
  - 排查端口被占、内存不够、节点不健康、镜像下载失败等常见问题
  quality:
  - 养成“看状态、看日志、对照排查表”的排错习惯，遇到报错先读懂提示再动手
  - 体会容器化带来的环境一致性，在云主机上实验时注意不把服务端口暴露到公网
key_points:
- Docker 的四个概念和八条常用命令
- 用 Docker Compose 启动随书集群，看懂 docker-compose.yml
- Hadoop 四个配置文件，改配置后怎样生效
- 从进程、节点、网页三个层面检查集群
difficulties:
- point: 端口映射、数据卷、容器内外路径容易混淆，学生分不清命令该在哪里运行、路径指的是哪里
  solution: 用“集群地图”动画点击端口和容器，演示 localhost:9870 怎样转进 master；在黑板上画出“宿主机 labs 目录 ↔ 容器 /labs ↔ HDFS 路径”三层关系图，让学生标出 -put 命令中每个路径属于哪一层
- point: 环境问题五花八门（Docker 装不上、镜像拉不下、端口被占、内存不够），课堂时间容易被个别问题拖住
  solution: 课前发布安装指南并要求提交 docker version 截图；课上集中演示排错三步法和排查表，个别问题课后在线答疑；准备好用 docker save 导出的镜像文件离线分发
- point: 改了配置文件不生效，学生不知道原因
  solution: 现场演示用 sed -i 修改后 getconf 仍是旧值、restart 后变为新值；再演示副本数只影响新文件，引出 setrep
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 120
    content: 学习网页教材第 2 章 2.1～2.8 节，操作“集群地图”动画；按 2.2.3 节安装 Docker 并配置镜像加速
    teacher: 发布学习任务单和 Docker 安装指南，要求提交 docker version 和 docker compose version 的截图；提前准备离线镜像文件
    student: 阅读教材、安装 Docker，在讨论区提交截图和遇到的问题
    intent: 把耗时的安装工作放在课前，面授集中解决集群启动和排错
  - name: 实验 2-1
    minutes: 60
    content: 实验 2-1 安装 Docker 并运行第一个容器：用 nginx 镜像练习八条命令和端口映射
    teacher: 在线答疑，汇总典型问题（WSL 2、虚拟化、镜像加速）
    student: 完成实验 2-1，填写实验记录表
    intent: 熟悉 Docker 基本操作，为面授启动集群做好准备
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 小周装了一晚上集群没装好，组长说“一条命令三分钟搞定”
    teacher: 讲述情景，提问学生安装软件时遇到过哪些环境问题
    student: 分享经历
    intent: 引出容器化的意义
  - name: 难点讲解：四个概念与三层路径
    minutes: 15
    content: 讲评实验 2-1 中的端口冲突；用“集群地图”动画讲解端口映射和数据卷；画出宿主机、容器、HDFS 三层路径关系图；逐行解读 docker-compose.yml 的四个问题
    teacher: 操作动画、板书关系图，提问“worker2 的 9864 为什么在浏览器打不开”
    student: 在关系图上标出路径，回答提问
    intent: 突破难点一
  - name: 任务：一条命令启动集群
    minutes: 25
    content: 全班同步完成实验 2-2：docker compose up -d、运行 check_cluster.sh、打开 9870 和 8088 网页、上传订单表、填写节点检查表
    teacher: 投屏同步操作，巡视指导，记录未能启动的同学和原因
    student: 按步骤操作，填写节点检查表，互相帮助排查问题
    intent: 确保每位学生都有一个能用的集群
  - name: 演示：排错与改配置
    minutes: 15
    content: 演示排错三步法（看状态、看日志、对照排查表），现场制造端口冲突并解决；演示修改副本数、restart、getconf 确认，以及副本数只影响新文件
    teacher: 投屏演示，边操作边讲解四个配置文件
    student: 观看演示，记录排错步骤
    intent: 突破难点二、三
  - name: 任务：加一个节点
    minutes: 15
    content: 完成实验 2-3 第 1、2 步：用 docker-compose.worker3.yml 加入 worker3，观察 9870、8088 网页上节点数和总内存的变化；讨论横向扩展
    teacher: 指导操作，提问“加一个节点，集群多了什么”
    student: 操作并记录变化
    intent: 亲身体会横向扩展
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选第 3、5、8 题，多选第 2 题，判断第 2、3 题（在线作答）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，强调集群要保留到后续各章使用，预告第 3 章 HDFS
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 实验 2-3（剩余步骤）
    minutes: 60
    content: 完成实验 2-3 的改副本数步骤并恢复设置；完成本章课后练习（在线作答 18 题，简答 / 实操 5 题）
    teacher: 在线答疑，收集学生遇到的环境问题补充到常见问题
    student: 完成实验，提交实验报告
    intent: 巩固配置修改和集群检查
homework:
- 简答题：用自己的话解释镜像、Docker 容器、端口映射、数据卷四个概念，并以随书集群为例各举一个例子。
- 简答题：同学说“我的集群起不来了”，请写出你帮他排查的步骤。
- 简答题：电脑内存只有 8 GB，运行集群时非常卡，请推荐上机路线并说明理由。
- 实操题：用 Docker 再运行一个 nginx 网站，映射到 8090 端口，访问、查看日志后停止并删除。
- 实操题：把每个 NodeManager 给 YARN 的内存改成 3 GB，在 8088 网页上验证后改回。
- 实验报告：实验 2-1、实验 2-2、实验 2-3
assessment: 课堂练习正确率、节点检查表、课后作业和实验报告计入平时成绩
reflection: ''
