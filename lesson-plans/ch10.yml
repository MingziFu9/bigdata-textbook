# 第 10 章教案底稿。字段说明见 lesson-plans/README.md
chapter: 10
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 区分分类、回归和聚类，说出特征、标签、训练集、测试集和过拟合的含义
  - 说出 MLlib 的固定套路和 Pipeline 中 fit、transform 的区别
  - 说出混淆矩阵、AUC 和轮廓系数的含义
  skill:
  - 用 StringIndexer、OneHotEncoder、VectorAssembler、StandardScaler 和 Pipeline 搭建训练流程
  - 训练逻辑回归、随机森林和 K-Means 模型，用交叉验证挑参数
  - 保存模型并批量打分，输出营销名单
  quality:
  - 不迷信准确率，用合适的指标和业务效果评价模型
  - 了解大模型训练数据的清洗，体会数据工作对人工智能的基础作用
key_points:
- MLlib 的固定套路：特征处理、特征向量、模型、Pipeline、评估、保存
- 逻辑回归的概率输出与 AUC
- K-Means 分群与业务解释
difficulties:
- point: 不平衡数据上准确率高、模型却没用，学生难以理解
  solution: 先问“全说不复购，准确率多少”（79%），再展示混淆矩阵（1741 个复购只找出 203 个），最后用“前 20% 命中率 38.5%，是随便挑的 1.8 倍”说明排序的用法
- point: fit 与 transform、Estimator 与 Transformer 容易混淆
  solution: 用“学”和“用”两个字讲：StringIndexer 学编号、StandardScaler 学标准差、逻辑回归学系数；让学生说出每个组件 fit 时学到了什么
- point: K-Means 的 k 怎么选、分群结果怎么解释
  solution: 用“分布式 K-Means”动画演示一轮的三步；展示实验 10-2 中 k=2～8 的轮廓系数，讨论为什么最后选 k=4；让小组给四群起名字、提营销建议
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 120
    content: 学习网页教材第 10 章 10.1～10.6 节，操作“分布式 K-Means”动画；构建带 NumPy 的 spark 镜像
    teacher: 在学习平台发布学习任务单和三个预习问题：分类和聚类有什么不同？为什么要标准化？Pipeline 有什么好处？
    student: 阅读教材、操作动画，在讨论区提交预习问题的回答和疑问
    intent: 概念线上自学，把面授时间留给演示和难点
  - name: 实验 10-1
    minutes: 40
    content: 用前 23 天的订单做特征、后 7 天是否下单做标签，搭 Pipeline 训练逻辑回归，评估并保存模型
    teacher: 提供实验指导和常见问题排查表，在线答疑
    student: 完成实验 10-1，记录 AUC、混淆矩阵和命中率
    intent: 先跑通模型，带着结果进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 3
    content: 王经理的两个问题：一万张券发给谁？八类用户能不能自动分成三四群？
    teacher: 讲述情景，引出“预测将要发生什么”
    student: 讨论回答
    intent: 用业务问题引出机器学习
  - name: 固定套路与 Pipeline
    minutes: 9
    content: 机器学习速记；MLlib 与 scikit-learn 怎么选；四个特征组件；Pipeline 的 fit 和 transform
    teacher: 投屏讲解代码，提问每个组件学到了什么
    student: 回答提问
    intent: 突破难点二
  - name: 难点讲解：评估模型
    minutes: 10
    content: 混淆矩阵、AUC、前 20% 命中率；随机森林与交叉验证的结果对比，说明瓶颈在特征
    teacher: 讲授并组织讨论“这个模型能不能用”
    student: 小组讨论并汇报
    intent: 突破难点一
  - name: K-Means 分群
    minutes: 9
    content: 用动画演示分布式 K-Means；讲标准化和取对数；讨论 k 的选择，小组给四群起名字
    teacher: 操作动画，组织讨论
    student: 给四群起名字并提营销建议
    intent: 突破难点三
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选第 1、3、4、6、8、9 题（在线作答）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 4
    content: 用知识导图回顾要点；讲大模型训练数据的清洗；预告第 11 章调优
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 实验 10-2、10-3
    minutes: 65
    content: 完成实验 10-2（K-Means 用户分群），学有余力的完成实验 10-3（批量打分输出营销名单）；完成本章课后练习
    teacher: 在线答疑，收集环境问题补充到常见问题
    student: 完成实验，提交实验报告
    intent: 把面授内容落到实际操作
homework:
- 简答题：用自己的话说明 MLlib 的“固定套路”有哪几步，并说出 StringIndexer、OneHotEncoder、VectorAssembler、StandardScaler 各在哪一步、起什么作用。
- 简答题：运营部只有 1 万张券的预算。结合实验 10-1 的结果，说明为什么不该用“预测为 1 的人”作为发券名单，而应该怎样用这个模型。
- 简答题：比较第 8 章的 RFM 八类分层和本章的 K-Means 分群，各有什么优点和不足？
- 实操题：修改实验 10-1 的程序，把 `VectorAssembler` 中的年龄、性别、会员等级去掉，只保留 R、F、M、`avg_amount`、`categories`、`days_since_first` 六个行为特征，重新训练逻辑回归并在同一个测试集上计算 AUC 和混淆矩阵。与原来的结果比较，你能得出什么结论？
- 实操题：把实验 10-2 中的 k 改成 3，重新运行，写出三群的画像（人数、平均 R、F、M、销售额占比），并说明与 k = 4 相比，原来的四群是怎样重新组合的。
- 实验报告：实验 10-1、实验 10-2、实验 10-3（选做）
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
