# 第 7 章教案底稿。字段说明见 lesson-plans/README.md
chapter: 7
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出真实数据中常见的数据质量问题（重复、缺失、格式不一、类型错误、异常值）
  - 说出评价数据质量的规范性、完整性、准确性、一致性等方面，以及数据清洗的工作顺序
  skill:
  - 使用 DataFrame 读入 CSV、文本和 Parquet 数据，完成查看结构、选列、过滤、新增列
  - 运用去重、补缺失值、try_cast 类型转换、正则表达式、日期解析、删异常值，把一份脏订单清洗干净
  - 用左连接把订单与用户表、商品表合成宽表，按日期分区存成 Parquet，并与原始数据核对
  quality:
  - 养成“先定规则、再动手、后核对、要记录”的严谨作风，清洗结果要能被别人复现
  - 使用大模型辅助写代码时不外发真实数据，对生成的代码负责核对
key_points:
- DataFrame 的基本操作
- 去重、缺失值、类型转换、正则表达式、日期解析、异常值的处理方法
- 左连接合成宽表，按日期分区写 Parquet
- 清洗规则说明和结果核对
difficulties:
- point: 清洗步骤的先后顺序影响结果，学生体会不到
  solution: 用“数据清洗流水线”动画，先全部勾选（102000 行变 99700 行），再只勾 ③ 和 ⑤（100470 行），让学生解释差异；归纳“先统一格式再转换、先补缺失再删异常、先统一格式再合并”
- point: Spark 4 的 ANSI 模式下 cast 报错，改用 try_cast 后数据悄悄变成空值
  solution: 现场演示 cast 遇到 ¥59.80 的报错，再演示先 try_cast 后去 ¥ 时多出 800 个空值；强调转换前后统计空值
- point: 正则表达式符号多，学生看不懂、写不对
  solution: 只讲清洗中最常用的 6 个符号，每个配一个小象优选的例子；现场改省份后缀的正则，去掉 $ 看会误删什么
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 140
    content: 学习网页教材第 7 章 7.1～7.7 节，操作“数据清洗流水线”动画
    teacher: 在学习平台发布学习任务单和三个预习问题：脏数据有哪几类？为什么要先补缺失值再删异常值？清洗规则说明要写什么？
    student: 阅读教材、操作动画，在讨论区提交预习问题的回答和疑问
    intent: 概念线上自学，把面授时间留给演示和难点
  - name: 实验 7-1 第 1～3 步
    minutes: 35
    content: 生成脏订单，读入并统计每列空值、各种写法和取值范围
    teacher: 提供实验指导和常见问题排查表，在线答疑
    student: 完成“看数据”的步骤，记录发现的问题
    intent: 带着发现的问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 小林交的销售额比财务多了两百多万，“广东”和“广东省”分成两行；请学生说出自己见过的脏数据
    teacher: 讲述情景，组织学生发言
    student: 回答提问
    intent: 建立“先洗干净再算”的意识
  - name: 难点讲解：清洗顺序
    minutes: 10
    content: 讲清洗工作顺序；操作“数据清洗流水线”动画，比较不同组合的行数
    teacher: 投屏演示，追问“只勾 ③ 和 ⑤ 时为什么是 100470 行”
    student: 观察动画，解释差异
    intent: 突破难点一
  - name: 类型转换与正则表达式
    minutes: 12
    content: 演示 cast 报错与 try_cast；讲常用正则符号，现场改省份后缀的正则；讲 4 种时间写法的解析
    teacher: 投屏演示，边改边讲
    student: 跟着在 pyspark 中试验
    intent: 突破难点二、三
  - name: 合并与保存
    minutes: 6
    content: 讲左连接和宽表，为什么先统一格式再合并；讲 Parquet 列式存储和按日期分区；清洗规则说明的内容
    teacher: 讲授并提问
    student: 回答提问
    intent: 完成清洗的后半程
  - name: 课堂练习
    minutes: 8
    content: 课后练习中的单选第 1、4、7 题，判断第 4、5 题（在线作答）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 4
    content: 用知识导图回顾要点；讨论用大模型写清洗代码的注意事项；预告第 8 章 Spark SQL 分析
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 实验 7-1、7-2（实验 7-3 选做）
    minutes: 50
    content: 完成实验 7-1 余下步骤并与原始数据逐行核对，完成实验 7-2（解析日志存 Parquet）；学有余力的完成实验 7-3（宽表与清洗报告）；完成本章课后练习
    teacher: 在线答疑，收集环境问题补充到常见问题
    student: 完成实验，提交实验报告和清洗规则说明
    intent: 把面授内容落到实际操作
homework:
- 简答题：数据清洗一般按哪几步进行？为什么“定规则”这一步不能跳过？
- 简答题：实验 7-1 先按整行去重，在统一格式之后又按订单号去重一次。为什么要去重两次？
- 简答题：一份清洗规则说明至少应包括哪些内容？以“省份”字段为例写出它的清洗规则。
- 实操题：在 spark 容器的 pyspark 中读入 `orders_dirty.csv`，统计“用户编号”列中含大写字母 U 的行数；把用户编号统一成小写后，再统计一次。写出代码和结果。
- 实操题：修改实验 7-2 的程序，从解析好的日志中统计每小时的 PV（全部访问）和商品详情页的访问次数，按小时排序输出，并把结果存成 Parquet 到 `labs/data/xiaoxiang_clean/hourly/`。写出新增的代码，报告访问最多的是哪个小时。
- 实验报告：实验 7-1、实验 7-2、实验 7-3（选做）
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
