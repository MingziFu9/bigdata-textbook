# 第 8 章教案底稿。字段说明见 lesson-plans/README.md
chapter: 8
online: 6
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 Spark SQL 的两种写法及其对应关系，窗口函数与 GROUP BY 的区别
  - 说出 GMV、客单价、复购率、转化率、留存率的算法和 RFM 模型的含义
  skill:
  - 分别用 DataFrame 和 SQL 完成分组聚合、TopN、透视表，用窗口函数完成分组排名、累计、移动平均和环比
  - 计算每个用户的 R、F、M 并分成 8 类，根据结果提出运营建议
  - 用 Spark 读写 Hive 表、通过 JDBC 写入 MySQL，用 pandas 画图；根据数据量判断该用 pandas 还是 Spark
  quality:
  - 养成写报告先注明指标口径的习惯，用数据支持业务决策
  - 正确看待 Text-to-SQL 等智能工具，理解懂业务、懂口径的人在大模型时代更重要
key_points:
- DataFrame 写法与 SQL 写法的对应
- 窗口函数的分组、排序、范围和常用四类计算
- 电商常用指标的口径和 RFM 用户分层
- Spark 读写 Hive 与 MySQL，pandas 与 Spark 的分工
difficulties:
- point: 窗口函数“保留每一行、多算一列”，学生容易和 GROUP BY 混淆，不理解范围的写法
  solution: 用“窗口函数”动画逐行演示，对比勾选和取消“按省份分组”；用 300、200、200、100 的例子比较三个排名函数；讲移动平均时让学生说出第 3 天的窗口包含哪几天
- point: 指标口径不清，复购率、客单价算错
  solution: 先给出口径表，再让学生用 9 月数据手算客单价（141,636,638.80 ÷ 48644），讨论“复购率 = 订单数 ÷ 用户数”错在哪里
- point: 读写 Hive 和 MySQL 涉及多个容器和驱动，容易卡在环境上
  solution: 课前发布启动命令和 JDBC 驱动下载方法；课上现场演示一遍写入 MySQL 并用 pandas 读出，讲清容器内用 mysql:3306、本机用 localhost:3306
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 150
    content: 学习网页教材第 8 章 8.1～8.7 节，操作“窗口函数”动画；下载 MySQL JDBC 驱动
    teacher: 在学习平台发布学习任务单和三个预习问题：窗口函数与 GROUP BY 有什么不同？客单价怎么算？RFM 的三个字母各是什么？
    student: 阅读教材、操作动画，在讨论区提交预习问题的回答和疑问
    intent: 概念线上自学，把面授时间留给演示和难点
  - name: 实验 8-1
    minutes: 40
    content: 用实验 7-3 的宽表计算整体指标，做多维分析和窗口函数计算
    teacher: 提供实验指导和常见问题排查表，在线答疑
    student: 完成实验 8-1，记录主要结果
    intent: 先算出指标，带着结果进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 4
    content: 运营部的一串问题：哪个品类卖得最好？每省前三名？优惠券只够发一万人，发给谁？
    teacher: 讲述情景，请学生说出每个问题该怎么算
    student: 回答提问
    intent: 用业务问题引出本章内容
  - name: 两种写法与常用分析
    minutes: 7
    content: 对照讲 DataFrame 与 SQL 写法；临时视图；countDistinct；透视表
    teacher: 投屏对照演示
    student: 跟着在 pyspark 中试验
    intent: 掌握基本写法
  - name: 难点讲解：窗口函数
    minutes: 10
    content: 用“窗口函数”动画逐行演示四类计算；比较三个排名函数；讨论移动平均和环比的边界
    teacher: 操作动画讲解，提问
    student: 回答“第 3 天的窗口有几行”等问题
    intent: 突破难点一
  - name: 指标口径与 RFM
    minutes: 10
    content: 讲指标口径表，学生手算客单价；讲 RFM 三步和 8 类用户结果，讨论一万张券发给谁；演示写入 MySQL 和 pandas 画图，比较 pandas 与 Spark 的耗时
    teacher: 讲授并组织讨论
    student: 小组讨论并汇报发券方案
    intent: 突破难点二、三
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选第 2、6、7、8、9 题，多选第 4 题（在线作答）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 4
    content: 用知识导图回顾要点；讨论 Text-to-SQL；预告第 9 章实时处理
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 实验 8-2、8-3
    minutes: 80
    content: 完成实验 8-2（RFM 用户分层，提出发券建议），学有余力的完成实验 8-3（读写 Hive 与 MySQL，比较 pandas 和 Spark 的耗时）；完成本章课后练习
    teacher: 在线答疑，收集环境问题补充到常见问题
    student: 完成实验，提交实验报告和发券建议
    intent: 把面授内容落到实际操作
homework:
- 简答题：用自己的话说明 `row_number`、`rank`、`dense_rank` 的区别，并各举一个适合使用的场合。
- 简答题：什么是 RFM 模型？说明实验 8-2 的分层步骤，并说说为什么分层前要先看极端值。
- 简答题：一个数据任务，原始数据有 5000 万行、存放在 HDFS 上，结果是 30 行的每日汇总，最后要画成折线图。你会怎样分配 Spark 和 pandas 的工作？说明理由。
- 实操题：用实验 7-3 的宽表，统计每种支付方式的销售额、订单数和笔单价（只算已完成的订单），分别用 DataFrame 写法和 SQL 写法完成，按销售额从高到低排列。写出代码和结果。
- 实操题：在实验 8-1 程序的基础上，计算 9 月每天的下单用户数，以及它的 7 日移动平均，找出下单用户数最多的一天。写出新增的代码和结论。
- 实验报告：实验 8-1、实验 8-2、实验 8-3（选做）
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
