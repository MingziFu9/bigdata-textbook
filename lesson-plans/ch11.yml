# 第 11 章教案底稿。字段说明见 lesson-plans/README.md
chapter: 11
online: 4
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出小文件、CSV、大表关联小表、数据倾斜、内存不够五类问题的现象和原因
  - 说出行式与列式存储、列裁剪、谓词下推、广播连接、加盐、AQE 的含义
  skill:
  - 用 Spark UI 找到最慢的阶段，根据任务耗时的中位数和最大值判断问题类型
  - 用合并文件、换 Parquet、广播连接、加盐、调整并行度等方法解决对应问题
  - 对照性能问题排查表，为慢程序或报错程序提出改法
  quality:
  - 养成“先测量、再优化”的工作习惯，用数据说明优化效果
  - 了解湖仓一体等新技术，保持持续学习的意识
key_points:
- 用 Spark UI 定位最慢的阶段
- 五类常见问题的现象、原因和改法
- 性能问题排查表与排查顺序
difficulties:
- point: 从 Summary Metrics 判断“整体慢”还是“个别慢”
  solution: 展示实验 11-2 的截图（耗时中位数 11 毫秒、最长 0.9 秒；读入行数中位数 2778、最多 170 万），让学生自己判断；再对比一个小文件问题的截图
- point: 列式存储为什么少读数据、加盐为什么能打散热点
  solution: 用“行式与列式存储”和“数据倾斜与加盐”两个动画演示；用实验结果（Parquet 只有 CSV 的 22%、加盐后最大任务从 170 万行降到 17.7 万行）印证
- point: 在 4 核笔记本上加盐“不显得快”，学生会怀疑方法无效
  solution: 用动画在 4 核和 64 核之间切换，说明核越多倾斜的代价越大，并组织讨论
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 90
    content: 学习网页教材第 11 章 11.1～11.8 节，操作“行式与列式存储”“数据倾斜与加盐”两个动画；生成 300 万行订单数据
    teacher: 在学习平台发布学习任务单和三个预习问题：一个阶段的用时取决于什么？Parquet 为什么比 CSV 快？什么是数据倾斜？
    student: 阅读教材、操作动画，在讨论区提交预习问题的回答和疑问
    intent: 概念线上自学，把面授时间留给演示和难点
  - name: 实验 11-1
    minutes: 30
    content: 300 万行订单从 CSV 转 Parquet，比较大小、耗时和执行计划；比较 2000 个小文件与合并后的查询
    teacher: 提供实验指导和常见问题排查表，在线答疑
    student: 完成实验 11-1，填写实验记录表
    intent: 先体会格式和文件数的影响，带着结果进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 3
    content: “双十一”前的三个麻烦：日报变慢、进度条卡在 199/200、内存溢出
    teacher: 讲述情景，请学生猜原因
    student: 讨论回答
    intent: 引出五类常见问题
  - name: 难点讲解：看 Spark UI
    minutes: 8
    content: 先测量；三步找到慢在哪里；Summary Metrics 的读法
    teacher: 投屏展示截图并提问
    student: 判断截图中的问题类型
    intent: 突破难点一
  - name: 五类问题
    minutes: 16
    content: 小文件与 CSV（行式与列式动画）、广播连接、数据倾斜与加盐（动画，4 核与 64 核对比）、AQE、内存溢出的排查顺序
    teacher: 操作动画讲解，组织讨论
    student: 回答提问，讨论加盐在笔记本和集群上的差别
    intent: 突破难点二、三
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选第 1、2、4、6、7、9 题（在线作答）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 8
    content: 讲性能问题排查表和排查顺序；介绍湖仓一体；预告第 12 章
    teacher: 带领学生梳理排查表和知识导图
    student: 复述排查顺序
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 实验 11-2、11-3
    minutes: 60
    content: 完成实验 11-2（热点店铺的数据倾斜），学有余力的完成实验 11-3（广播连接）；完成本章课后练习
    teacher: 在线答疑，收集环境问题补充到常见问题
    student: 完成实验，提交实验报告
    intent: 把面授内容落到实际操作
homework:
- 简答题：用“现象 → 原因 → 怎么改”的格式，说明小文件太多这个问题。
- 简答题：什么是数据倾斜？结合实验 11-2，说明加盐的做法和效果，以及为什么在 4 核的电脑上总时间没有明显变短。
- 简答题：小林的程序在 YARN 上运行时，有几个任务反复报 `Container killed by YARN for exceeding memory limits`，他准备把执行器内存从 4 GB 加到 16 GB。请你按本章的排查顺序给他提建议。
- 实操题：把实验 11-2 中盐的个数 N 分别改成 5 和 50，运行加盐的关联，记录关联阶段读入行数的最大值、最长任务耗时和总耗时，与 N = 20 比较，说说盐是不是越多越好。
- 实操题：读入实验 11-1 生成的 `orders_parquet`，用 `partitionBy("province")` 按省份分区写出，统计一共写出了多少个 Parquet 文件；再在写之前加上 `repartition("province")`，重新统计文件个数。解释两次结果为什么不同。
- 实验报告：实验 11-1、实验 11-2、实验 11-3（选做）
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
