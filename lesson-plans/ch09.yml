# 第 9 章教案底稿。字段说明见 lesson-plans/README.md
chapter: 9
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出批处理与实时处理的区别和实时处理的典型场景
  - 说出 Kafka 的主题、分区、偏移量、消费者组和消费积压的含义
  - 说出事件时间、水位线、输出模式和检查点的作用
  skill:
  - 用命令行和 Python 在 Kafka 中收发消息，查看消费积压
  - 编写 Structured Streaming 程序，从 Kafka 读订单并按事件时间窗口统计成交额
  - 根据业务要求选择水位线，用检查点让程序重启后接着算
  quality:
  - 理解“快、准、省”之间的取舍，根据业务需要而不是技术偏好选择方案
  - 了解国内实时计算的主流技术和应用，增强对国产大数据生态的认识
key_points:
- Kafka 的主题、分区、偏移量和消费者组
- Structured Streaming 的无界表、窗口统计和输出模式
- 水位线和检查点
difficulties:
- point: 消费者组的“组内分摊、组间独立”和再均衡比较抽象
  solution: 用“分区与消费者组”动画演示：先发消息看键与分区的关系，再把消费者加到 4 个看谁闲着，最后让一个消费者宕机看分区重新分配
- point: 水位线怎样计算、迟到的数据什么时候被丢掉，学生不容易想清楚
  solution: 用“迟到数据与水位线”动画一笔一笔地演示，让学生预测下一笔会不会被丢掉；再对照实验 9-3 中三种水位线少算的笔数（83、54、0 笔）
- point: 本机程序和容器内程序连 Kafka 的地址不同，Spark 读 Kafka 还要额外的 jar 包，容易卡在环境上
  solution: 课前发布 jar 包下载命令；课上用一张表讲清 localhost:9094 和 kafka:9092 的区别，现场演示 --jars $KAFKA_JARS
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 120
    content: 学习网页教材第 9 章 9.1～9.7 节，操作“分区与消费者组”“迟到数据与水位线”两个动画；下载 Spark 读 Kafka 的 4 个 jar 包
    teacher: 在学习平台发布学习任务单和三个预习问题：为什么要在下单系统和大屏之间放一个 Kafka？什么是消费积压？为什么按事件时间统计？
    student: 阅读教材、操作动画，在讨论区提交预习问题的回答和疑问
    intent: 概念线上自学，把面授时间留给演示和难点
  - name: 实验 9-1
    minutes: 35
    content: 启动 Kafka 容器，用命令行和 Python 收发消息，观察消费者组和消费积压
    teacher: 提供实验指导和常见问题排查表，在线答疑
    student: 完成实验 9-1，记录分区分配和积压数据
    intent: 先跑通 Kafka，带着结果进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 3
    content: 国庆狂欢夜：老板要看“这一分钟卖了多少钱”，风控要几秒内拦下可疑订单
    teacher: 讲述情景，提问“每分钟跑一次第 8 章的程序行不行”
    student: 讨论回答
    intent: 引出实时处理的需求
  - name: 难点讲解：Kafka 与消费者组
    minutes: 9
    content: 讲主题、分区、偏移量；用动画演示消费者组的两条规则、再均衡和消费积压
    teacher: 操作动画讲解，提问
    student: 回答“4 个消费者读 3 个分区会怎样”
    intent: 突破难点一
  - name: Structured Streaming
    minutes: 9
    content: 讲无界表；演示读 Kafka、解析 JSON、按 1 分钟窗口统计、三种输出模式；展示 Spark UI 的流处理页面
    teacher: 投屏演示实验 9-2 的程序
    student: 对照教材跟读代码
    intent: 掌握流处理程序的写法
  - name: 难点讲解：水位线与检查点
    minutes: 12
    content: 用动画演示水位线；对照实验 9-3 的三种水位线；讲检查点的停机重启试验和删除检查点的场合
    teacher: 操作动画，让学生预测结果
    student: 预测并解释每笔订单的去向
    intent: 突破难点二
  - name: 课堂练习
    minutes: 8
    content: 课后练习中的单选第 4、5、7、8、9 题（在线作答）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 4
    content: 用知识导图回顾要点；比较 Flink 与 Structured Streaming；预告第 10 章 MLlib
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 实验 9-2、9-3
    minutes: 70
    content: 完成实验 9-2（实时成交额统计，验证检查点），学有余力的完成实验 9-3（三种水位线）；完成本章课后练习
    teacher: 在线答疑，收集环境问题补充到常见问题
    student: 完成实验，提交实验报告
    intent: 把面授内容落到实际操作
homework:
- 简答题：用“快递中转站”打比方，说明 Kafka 的主题、分区、偏移量和消费者组分别相当于什么。
- 简答题：什么是水位线？以实验 9-3 的结果为例，说明水位线设大设小各有什么好处和代价。
- 简答题：小象优选的实时成交额程序每次升级都要重启。说明检查点是怎样保证重启后“不丢不重”的，以及使用检查点要注意什么。
- 实操题：仿照实验 9-1 的 `order_consumer.py`，写一个 Python 消费者（消费者组取名 `pay`），从头读主题 orders 中实验 9-1 发出的订单，统计每种支付方式的订单数和金额，按 `Ctrl + C` 后打印结果。写出代码和结果。
- 实操题：修改实验 9-2 的程序，统计“最近 5 分钟的成交额和订单数，每 1 分钟滑动一次”，运行后与按分钟的标准答案核对其中一个窗口。写出修改的代码和你的核对过程。
- 实验报告：实验 9-1、实验 9-2、实验 9-3（选做）
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
