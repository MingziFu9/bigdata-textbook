# 第 5 章教案底稿。字段说明见 lesson-plans/README.md
chapter: 5
online: 6
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 Hive 解决的问题，以及 Metastore、HiveServer2、HDFS 在一次查询中的分工
  - 区分数据库与数据仓库、事实表与维度表，说出 ODS、DWD、DWS、ADS 四层各放什么数据
  skill:
  - 用 Beeline 连接 HiveServer2，编写 HiveQL 建内部表、外部表和分区表，导入数据并完成分组统计、多表连接、TopN 和窗口函数查询
  - 判断一个查询能否用上分区裁剪，按 ODS → DWD → DWS → ADS 加工出一份日报
  - 判断一个分析任务适合用 Hive、MySQL 还是交互式查询引擎
  quality:
  - 养成写清口径、分层加工的数据规范意识，知道同一个指标在全公司要用同一套算法
  - 了解 Doris、StarRocks 等国产开源数据库在企业中的应用，增强技术自信
key_points:
- Hive 表 = Metastore 中的表结构 + HDFS 上的文件
- 内部表与外部表、分区表的建法和区别
- 常用 HiveQL：分组统计、多表连接、TopN、窗口函数
- 数据仓库四层分层和事实表、维度表
difficulties:
- point: 学生分不清“删表删不删数据”，不理解表和文件的关系
  solution: 课上现场在 Beeline 中分别 DROP 内部表和外部表，再用 hdfs dfs -ls 查看目录还在不在；配合架构图说明“表结构在 Metastore，数据在 HDFS”
- point: 分区表为什么快、什么条件才能用上分区裁剪
  solution: 先让学生猜“查一天要读多少行”，再操作“分区表查询”动画核对；展示实验 5-2 实测数据（不分区 7.2 秒、分区 1.0 秒），并让学生判断只按省份筛选能否用上分区
- point: 数据仓库分层抽象，学生不知道每一层该放什么
  solution: 用“原材料 → 净菜 → 半成品 → 上桌的菜”做比方，对照实验 5-3 的四张表逐层查看数据，说出每一层比上一层多做了什么
process:
- phase: 课前（线上）
  steps:
  - name: 自主学习
    minutes: 150
    content: 学习网页教材第 5 章 5.1～5.6 节，操作“分区表查询”动画，阅读数据仓库分层的小象优选例子
    teacher: 在学习平台发布学习任务单和三个预习问题：删外部表数据还在吗？分区表为什么快？ODS 和 DWD 有什么不同？
    student: 阅读教材、操作动画，在讨论区提交预习问题的回答和疑问
    intent: 概念线上自学，把面授时间留给演示和难点
  - name: 实验 5-1
    minutes: 45
    content: 启动 Hive 容器，用 Beeline 建外部表统计品类销售额，对比删除内部表和外部表
    teacher: 提供实验指导和常见问题排查表，在线答疑
    student: 完成实验 5-1，填写实验记录表
    intent: 先上手写 SQL，为面授中的分区和分层做准备
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 5
    content: 运营每周要报表，数据组每次改口径都要改 MapReduce 代码；提问“数据在 HDFS 上，能不能直接用 SQL 查”
    teacher: 讲述情景，引出 Hive
    student: 回答提问，回忆第 4 章 MapReduce 的写法
    intent: 用对比激发学习 Hive 的需要
  - name: 难点讲解：表与文件、内部表与外部表
    minutes: 10
    content: 用架构图讲一次查询的过程；现场 DROP 内部表和外部表，查看 HDFS 目录
    teacher: 投屏演示，追问“往表目录里放一个同格式的文件会怎样”
    student: 观察演示，回答提问
    intent: 突破难点一
  - name: 分区表与分区裁剪
    minutes: 10
    content: 操作“分区表查询”动画；展示实验 5-2 实测数据；判断几个 WHERE 条件能否用上分区
    teacher: 组织学生先猜后验，讲评
    student: 操作动画，判断并说明理由
    intent: 突破难点二
  - name: 数据仓库分层
    minutes: 8
    content: 用做菜比方讲四层；对照实验 5-3 的四张表，说出每层多做了什么；讲事实表关联维度表的套路
    teacher: 讲授并提问
    student: 小组讨论并汇报
    intent: 突破难点三
  - name: 课堂练习
    minutes: 8
    content: 课后练习中的单选第 5、6、8 题，多选第 3 题，判断第 2 题（在线作答）
    teacher: 组织作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 4
    content: 用知识导图回顾要点；说明什么时候不该用 Hive；预告第 6 章 Spark
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 实验 5-2、5-3
    minutes: 75
    content: 完成实验 5-2（动态分区与分区裁剪），学有余力的完成实验 5-3（四层加工每日各省销售日报）；完成本章课后练习
    teacher: 在线答疑，收集环境问题补充到常见问题
    student: 完成实验，提交实验报告
    intent: 把面授内容落到实际操作
homework:
- 简答题：用“做菜”打比方，说明 ODS、DWD、DWS、ADS 四层各放什么数据，并以小象优选为例各举一张表。
- 简答题：比较内部表和外部表，说明小象优选的原始订单数据应该建成哪一种，为什么。
- 简答题：小象优选的订单表一年有 3600 万行，按天分区，每天约 10 万行。运营人员查询“上周七天的销售额”，用分区表大约要读多少行？如果不分区呢？请说明分区裁剪的原理。
- 实操题：在随书 Hive 中，统计各省份已完成订单的订单数和销售额，取销售额前 5 名。写出 SQL 和结果。
- 实操题：在实验 5-3 的基础上，查询 9 月 30 日广东省的销售额和“月初至今累计销售额”，并找出这一天日环比增长最多的 3 个省份。写出 SQL 和结果。
- 实验报告：实验 5-1、实验 5-2、实验 5-3（选做）
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
