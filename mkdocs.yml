# 站点名、描述、网址和 nav 由 python tools/course.py sync 根据 course.yml 生成，请改 course.yml，不要手改这几项
site_name: 大数据技术处理技术
site_description: 面向成人教育人工智能技术应用专业（专科）的《大数据技术处理技术》教材，12 章 36 个动手实验，在自己电脑上用 Docker 搭 Hadoop/Spark 小集群
site_url: https://mingzifu9.github.io/bigdata-textbook/
repo_url: https://github.com/MingziFu9/bigdata-textbook
docs_dir: docs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - css/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/book.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - 首页: index.md
  - 课程描述: course-description.md
  - "第 1 章 大数据概述与技术生态": chapters/01-overview/index.md
  - "第 2 章 实验环境：Docker 与 Hadoop 集群": chapters/02-environment/index.md
  - "第 3 章 HDFS 分布式文件系统": chapters/03-hdfs/index.md
  - "第 4 章 MapReduce 与 YARN": chapters/04-mapreduce-yarn/index.md
  - "第 5 章 Hive 数据仓库": chapters/05-hive/index.md
  - "第 6 章 Spark 入门与 RDD 编程": chapters/06-spark-rdd/index.md
  - "第 7 章 用 Spark 做数据清洗": chapters/07-data-cleaning/index.md
  - "第 8 章 DataFrame 与 Spark SQL 数据分析": chapters/08-spark-sql/index.md
  - "第 9 章 Kafka 与实时数据处理": chapters/09-streaming/index.md
  - "第 10 章 Spark MLlib 机器学习应用": chapters/10-mllib/index.md
  - "第 11 章 常见问题与调优": chapters/11-tuning/index.md
  - "第 12 章 数据可视化、数据合规与综合项目": chapters/12-visualization-project/index.md
  - 交互动画:
    - sims/index.md
    - "MapReduce 词频统计全流程": sims/mapreduce-wordcount/index.md
    - "YARN 资源分配": sims/yarn-scheduling/index.md
  - 学习图谱: learning-graph/index.md
  - 常见问题: faq/index.md
  - "在线模拟卷": mock-exam.md
  - 附录:
    - "附录 A Linux 与 PySpark 速查": appendix/a-linux-pyspark.md
    - "附录 B 大数据组件速查": appendix/b-components.md
    - "附录 C 实验环境与数据说明": appendix/c-environment.md
    - "附录 D 术语表": appendix/glossary.md
