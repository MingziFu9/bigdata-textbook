# 第 9 章：Kafka 消息队列（单节点，KRaft 模式，不需要 ZooKeeper）
# 启动：docker compose -f docker-compose.yml -f docker-compose.spark.yml -f docker-compose.kafka.yml up -d
# 进入：docker compose -f docker-compose.yml -f docker-compose.spark.yml -f docker-compose.kafka.yml exec kafka bash
# 容器里的程序（如 spark 容器）连 kafka:9092；本机的 Python 程序连 localhost:9094
services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    environment:
      TZ: Asia/Shanghai
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller          # 一个节点同时当 Broker 和控制器
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1       # 只有一个节点，副本数只能是 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3                         # 新建主题默认 3 个分区
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ../:/labs
volumes:
  kafka-data:
