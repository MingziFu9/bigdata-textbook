# 随书 Spark 容器的默认配置
spark.driver.memory                1g
spark.sql.session.timeZone         Asia/Shanghai
# 提交到 YARN 时：工作节点上的 Hadoop 镜像是 Java 11，Spark 4 需要 Java 17 以上，
# 所以让 YARN 容器使用从 Spark 镜像共享过去的 Java 21（见 docker-compose.spark.yml 的 spark-jdk 数据卷）
spark.yarn.appMasterEnv.JAVA_HOME  /opt/spark-jdk
spark.executorEnv.JAVA_HOME        /opt/spark-jdk
spark.yarn.am.memory               512m
spark.executor.memory              512m
spark.executor.instances           2
# 读写 Hive 表（第 8 章）：Hive 4 的元数据服务要用 Hive 4 的客户端程序库
spark.sql.hive.metastore.version     4.1.0
spark.sql.hive.metastore.jars        path
spark.sql.hive.metastore.jars.path   file:///opt/hive-lib/*.jar,file:///opt/spark/jars/hadoop-client-api-3.4.2.jar,file:///opt/spark/jars/hadoop-client-runtime-3.4.2.jar
